name: monolith

# Arquivo BASE = PRODUÇÃO. É o artefato canônico de deploy.
#
#   prd : docker compose -f docker-compose.yml up -d --build
#         (aponta SÓ este arquivo, excluindo o override de dev)
#
#   dev : docker compose up --build
#         (o docker-compose.override.yml carrega automaticamente por cima e
#          transforma este setup em ambiente de desenvolvimento)
#
# ⚠️ Como o override carrega sozinho, NUNCA rode `docker compose up` (sem -f) num
#    servidor de produção: ele puxaria a config de dev. Em prd use sempre o -f acima.

services:
  app:
    build:
      context: .
      target: production       # estágio sem deps de dev, código imutável, non-root
    env_file: .env             # injeta DATABASE_URL, credenciais etc. no container
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Múltiplos workers para aproveitar os núcleos da máquina. SEM --reload.
    # Regra de bolso: ~2 x núcleos do host.
    command: ["uv", "run", "uvicorn", "monolith.interfaces.api.main:app", "--host=0.0.0.0", "--port=8000", "--workers=4"]
    extra_hosts:
      # Permite acessar serviços do host (ex: Ollama) via "host.docker.internal".
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully  # app só sobe com o schema migrado
      ollama-pull:
        condition: service_completed_successfully  # ...e com o modelo de embeddings baixado
      minio-init:
        condition: service_completed_successfully  # ...e com o bucket criado

  # Roda `alembic upgrade head` uma vez e termina. Reusa a imagem de produção.
  migrate:
    build:
      context: .
      target: production
    env_file: .env
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  # Ollama self-hosted só para embeddings (o chat vai pra cloud via LLM_BASE_URL).
  ollama:
    image: alpine/ollama:0.24.0
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  # Baixa o EMBEDDINGS_MODEL uma vez e termina. Idempotente (no-op se já está no volume).
  ollama-pull:
    image: alpine/ollama:0.24.0
    env_file: .env
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull $$EMBEDDINGS_MODEL"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Sem `ports`: em prd o Postgres fica só na rede interna do Compose, não no host.
    # (o override de dev expõe a 5432 para você conectar com DBeaver/psql.)
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  # Object store S3-compatible. Guarda os PDFs e serve direto ao browser via
  # presigned URL, para os bytes não passarem pelos workers do app.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    env_file: .env              # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    ports:
      # A 9000 precisa ser alcançável pelo BROWSER: é o host que entra na
      # assinatura da presigned URL. Em prd, ponha atrás de TLS.
      # A 9001 (console web) fica só no override de dev.
      - "9000:9000"
    restart: unless-stopped
    healthcheck:
      # curl já vem na imagem; /minio/health/live é o endpoint de liveness.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      # Intervalo curto de propósito: o minio-init espera este healthcheck e
      # ele, por sua vez, segura a subida do app.
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Cria o bucket uma vez e termina — MinIO não cria bucket sozinho. Mesmo
  # padrão do ollama-pull: idempotente, no-op se o bucket já existe.
  # O bucket nasce PRIVADO e continua assim: o acesso é sempre por presigned URL.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    env_file: .env
    entrypoint: ["sh", "-c", "mc alias set store $$MINIO_ENDPOINT $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing store/$$MINIO_BUCKET"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  db_data:
  ollama_data:
  minio_data:
