name: monolith

services:
  app:
    build:
      context: .
      target: developer     # usa o estágio "developer" do Dockerfile
    env_file: .env            # injeta DATABASE_URL e cia. no container
    ports:
      - "8000:8000"
    volumes:
      # Bind mount: espelha a pasta do host (".") dentro do container ("/app").
      # Sintaxe é sempre origem(host):destino(container).
      # É a MESMA pasta vista dos dois lados — editar um .py no host muda na hora
      # dentro do container, e o uvicorn --reload reinicia sozinho. Sem rebuild.
      - .:/app
      # Volume anônimo (sem ":", não aponta pro host): isola só o /app/.venv.
      # A linha de cima espelharia TUDO, inclusive a .venv local do host (que tem
      # paths da minha máquina e quebraria dentro do container). Como /app/.venv é
      # mais específico que /app, este mount "vence" e protege a .venv que o uv
      # montou no build. Resultado: código vem do host, .venv vem do container.
      - /app/.venv
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Permite acessar serviços do host (ex: Ollama) via "host.docker.internal"
    depends_on:
      db:
        condition: service_healthy  # Garante que o app só inicie depois do db estar saudável

  db: 
    image: dhi.io/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["pg_isready", "-U", "${POSTGRES_USER}", "-d", "postgres"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  db_data:
