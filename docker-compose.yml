name: monolith

services:
  app:
    build:
      context: .
      target: developer     # usa o estágio "developer" do Dockerfile
    env_file: .env            # injeta DATABASE_URL e cia. no container
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      # Bind mount: espelha a pasta do host (".") dentro do container ("/app").
      # Sintaxe é sempre origem(host):destino(container).
      # É a MESMA pasta vista dos dois lados — editar um .py no host muda na hora
      # dentro do container, e o uvicorn --reload reinicia sozinho. Sem rebuild.
      - .:/app
      # Volume anônimo (sem ":", não aponta pro host): isola só o /app/.venv.
      # A linha de cima espelharia TUDO, inclusive a .venv local do host (que tem
      # paths da minha máquina e quebraria dentro do container). Como /app/.venv é
      # mais específico que /app, este mount "vence" e protege a .venv que o uv
      # montou no build. Resultado: código vem do host, .venv vem do container.
      - /app/.venv
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Permite acessar serviços do host (ex: Ollama) via "host.docker.internal"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully  # Garante que o app só inicie depois do ollama-pull terminar e estar saudável 
  ollama: 
    image: alpine/ollama:0.24.0
    volumes:
      - ollama-models:/root/.ollama  # Volume para persistir os dados do Ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "ls"]  # Comando para verificar a saúde do serviço
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  ollama-pull: 
    image: alpine/ollama:0.24.0
    depends_on:
      ollama:
        condition: service_healthy  # Garante que o ollama-pull só inicie depois do ollama estar saudável
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull qwen2.5:3b && ollama pull embeddinggemma:300m"]  # Comando para baixar o modelo específico
    restart: "no"  # Não reinicia após a execução do comando

volumes:
  ollama-models:  # Volume nomeado para os dados do Ollama
