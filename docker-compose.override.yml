# Override de DESENVOLVIMENTO.
# Carregado AUTOMATICAMENTE em `docker compose up` (sem -f), mesclado por cima do
# docker-compose.yml (que é produção). Aqui mora só o que faz sentido em dev.

services:
  app:
    build:
      target: developer        # troca o estágio prod pelo de dev (todas as deps)
    # Sem `network_mode: host`: no Docker Desktop (WSL2/Windows) "host" é a VM
    # interna do Docker, não a sua máquina — a porta 8000 não chegaria no host.
    # Ficamos na rede bridge do Compose: `ports` do base vale e o app alcança o
    # Postgres por `db:5432` e o Ollama do PC por `host.docker.internal:11434`.
    # Sobrescreve o command de prod: 1 worker + --reload (reinicia ao salvar arquivo).
    command: ["uv", "run", "uvicorn", "monolith.interfaces.api.main:app", "--host=0.0.0.0", "--port=8000", "--reload"]
    depends_on:
      ollama-pull: !reset null   # dev usa o Ollama do host; sem pull em container
    volumes:
      # Bind mount: a MESMA pasta vista dos dois lados. Editar um .py no host muda
      # na hora dentro do container e o --reload reinicia sozinho. Sem rebuild.
      - .:/app
      # Volume anônimo que isola /app/.venv: protege a venv montada no build de ser
      # sobrescrita pela .venv do host (que tem paths da sua máquina e quebraria).
      - /app/.venv

  migrate:
    build:
      target: developer

  db:
    ports:
      # Em dev expomos o Postgres no host pra conectar com DBeaver/psql/etc.
      - "5432:5432"

  # Em dev usamos o Ollama do host; o container do base fica fora via profile.
  ollama:
    profiles: ["production"]

  ollama-pull:
    profiles: ["production"]

  # Console web do MinIO, para inspecionar o bucket na mão. Só em dev — em prd
  # não há motivo para expor o painel de administração.
  minio:
    ports:
      # A 9000 já vem da base; aqui só o painel.
      - "9001:9001"
